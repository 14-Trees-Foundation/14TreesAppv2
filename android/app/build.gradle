plugins {
    id("com.android.application")
    id("com.facebook.react")
    id("com.google.gms.google-services")
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

react { }

def enableProguardInReleaseBuilds = false

project.ext.envConfigFiles = [
   prodDebug: ".env.production",
   prodRelease: ".env.production",
   devRelease: ".env.development",
   devDebug: ".env.development",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

def jscFlavor = 'org.webkit:android-jsc:+'
Properties properties = new Properties()
properties.load(project.rootProject.file('local.properties').newDataInputStream())
def googleMapsAPIKey = properties.getProperty('secrets.googleMapsAPIKey')

android {
    namespace "com.androidappv2"

    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.androidappv2"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        resValue "string", "build_config_package", "com.androidappv2"
        manifestPlaceholders = [googleMapsAPIKey: googleMapsAPIKey]
    }

    signingConfigs {
        release {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    flavorDimensions "default"
    productFlavors {
        prod {
            resValue "string", "app_name", "14 Trees"
        }
        dev {
            applicationIdSuffix ".devlopment"
            resValue "string", "app_name", "Dev Trees"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}")
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }
    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation project(':react-native-fs')
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)
